## Configuración recomendada para MySQL (archivo classpath)
## Proyecto: base de datos `java18`, tabla `articulos`
## Ajusta usuario/contraseña según tu instalación local.

# URL JDBC para MySQL. Puerto por defecto 3306, base de datos java18.
# Se recomiendan parámetros: useSSL=false, allowPublicKeyRetrieval=true y serverTimezone=UTC
db.url=jdbc:mysql://localhost:3306/java18?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Usuario y contraseña por defecto (ajusta según tu entorno)
db.user=root
db.password=root

# Clase del driver MySQL (MySQL Connector/J moderno)
db.driver=com.mysql.cj.jdbc.Driver

# Notas:
# - Este archivo se utiliza si no hay variables de entorno (DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER).
# - Por seguridad, evita poner contraseñas reales en el repo; usa variables de entorno en producción.